        version_mode: &id017
          $ref: '#/components/schemas/VersionMode'
        fusion_strategy: &id018
          type:
          - string
          - 'null'
        fusion_config: *id009
        rerank_strategy: &id019
          type:
          - string
          - 'null'
        rerank_config: *id009
        metadata: *id009
        processors:
          type: array
          items:
            $ref: '#/components/schemas/DocumentProcessorDefinitionRequest'
        retrievals:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRetrievalDefinitionRequest'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ProcessorRetrievalBindingRequest'
    DocumentTypeDefinitionUpdateRequest:
      type: object
      required:
      - revision
      properties:
        revision:
          type: integer
          description: 乐观锁。必须回传 GET 得到的 revision，不匹配返回 409
        name:
          type: string
          maxLength: 255
        description:
          type:
          - string
          - 'null'
        analysis_mode:
          $ref: '#/components/schemas/AnalysisMode'
        allow_update:
          type: boolean
        version_mode:
          $ref: '#/components/schemas/VersionMode'
        fusion_strategy:
          type:
          - string
          - 'null'
        fusion_config: *id009
        rerank_strategy:
          type:
          - string
          - 'null'
        rerank_config: *id009
        metadata: *id009
        processors:
          type:
          - array
          - 'null'
          description: null=不触碰子表；数组=全量替换，未出现的既有 processor 会被软删除
          items:
            $ref: '#/components/schemas/DocumentProcessorDefinitionRequest'
        retrievals:
          type:
          - array
          - 'null'
          description: null=不触碰子表；数组=全量替换，未出现的既有 retrieval 会被软删除
          items:
            $ref: '#/components/schemas/DocumentRetrievalDefinitionRequest'
        bindings:
          type:
          - array
          - 'null'
          description: null=不触碰绑定；数组=全量替换。用下标引用同一次 payload 中的 processors / retrievals，因此必须与这两个数组一起提交。
          items:
            $ref: '#/components/schemas/ProcessorRetrievalBindingRequest'
    DocumentTypeDefinitionResponse:
