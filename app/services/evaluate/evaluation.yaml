openapi: 3.1.0

info:
  title: RAG Evaluation API
  version: 1.0.0
  description: |
    Evaluation and benchmarking API for RAG applications.

    The Evaluation Service owns:
      - Evaluation Datasets
      - Evaluation Cases
      - Benchmark definitions
      - Benchmark Runs
      - Evaluation Results
      - Metric Registry

    Metric implementations are pluggable:
      - native: deterministic metrics implemented by the Evaluation Service
      - ragas: metrics provided by Ragas
      - custom: user-defined evaluation metrics

    Ragas is treated as a metric provider rather than the owner
    of datasets, benchmarks, experiments, or evaluation runs.

servers:
  - url: /api/v1

tags:
  - name: Datasets
    description: Evaluation dataset management
  - name: Metrics
    description: Evaluation metric registry
  - name: Benchmarks
    description: Benchmark definition management
  - name: Runs
    description: Benchmark execution and results

paths:

  # ============================================================
  # Dataset
  # ============================================================

  /evaluation/datasets:
    get:
      tags:
        - Datasets
      summary: List evaluation datasets
      operationId: listEvaluationDatasets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          description: Search dataset name or description
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DatasetStatus"
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetList"

    post:
      tags:
        - Datasets
      summary: Create evaluation dataset
      operationId: createEvaluationDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetCreate"
      responses:
        "201":
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"


  /evaluation/datasets/{dataset_id}:
    get:
      tags:
        - Datasets
      summary: Get evaluation dataset
      operationId: getEvaluationDataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Evaluation dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          $ref: "#/components/responses/NotFound"


  /evaluation/datasets/{dataset_id}/cases:
    get:
      tags:
        - Datasets
      summary: List evaluation cases
      operationId: listEvaluationCases
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: document_type_definition_id
          in: query
          schema:
            type: string
        - name: document_version_id
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          description: Search question or reference answer
          schema:
            type: string
      responses:
        "200":
          description: Evaluation case list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseList"


  /evaluation/datasets/{dataset_id}/cases/{case_id}:
    get:
      tags:
        - Datasets
      summary: Get evaluation case
      operationId: getEvaluationCase
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Evaluation case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationCase"
        "404":
          $ref: "#/components/responses/NotFound"


  # ============================================================
  # Metrics
  # ============================================================

  /evaluation/metrics:
    get:
      tags:
        - Metrics
      summary: List available evaluation metrics
      operationId: listEvaluationMetrics
      parameters:
        - name: provider
          in: query
          description: Filter metrics by implementation provider
          schema:
            $ref: "#/components/schemas/MetricProvider"
        - name: category
          in: query
          description: Filter metrics by evaluation category
          schema:
            $ref: "#/components/schemas/MetricCategory"
      responses:
        "200":
          description: Available metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricDefinition"


  # ============================================================
  # Benchmark
  # ============================================================

  /evaluation/benchmarks:
    get:
      tags:
        - Benchmarks
      summary: List benchmark definitions
      operationId: listBenchmarks
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema:
            type: string
        - name: dataset_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Benchmark list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkList"

    post:
      tags:
        - Benchmarks
      summary: Create benchmark definition
      operationId: createBenchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkCreate"
      responses:
        "201":
          description: Benchmark created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Benchmark"


  /evaluation/benchmarks/{benchmark_id}:
    get:
      tags:
        - Benchmarks
      summary: Get benchmark definition
      operationId: getBenchmark
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
      responses:
        "200":
          description: Benchmark definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Benchmark"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Benchmarks
      summary: Update benchmark definition
      operationId: updateBenchmark
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkUpdate"
      responses:
        "200":
          description: Benchmark updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Benchmark"


  /evaluation/benchmarks/{benchmark_id}/runs:
    post:
      tags:
        - Runs
      summary: Start benchmark run
      operationId: createBenchmarkRun
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkRunCreate"
      responses:
        "202":
          description: Benchmark run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"


  # ============================================================
  # Runs
  # ============================================================

  /evaluation/runs:
    get:
      tags:
        - Runs
      summary: List benchmark runs
      operationId: listBenchmarkRuns
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: benchmark_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: Benchmark run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRunList"


  /evaluation/runs/{run_id}:
    get:
      tags:
        - Runs
      summary: Get benchmark run
      operationId: getBenchmarkRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Benchmark run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"
        "404":
          $ref: "#/components/responses/NotFound"


  /evaluation/runs/{run_id}/cancel:
    post:
      tags:
        - Runs
      summary: Cancel benchmark run
      operationId: cancelBenchmarkRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"


  /evaluation/runs/{run_id}/results:
    get:
      tags:
        - Runs
      summary: Get aggregated evaluation results
      operationId: getBenchmarkRunResults
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Aggregated evaluation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"


  /evaluation/runs/{run_id}/results/cases:
    get:
      tags:
        - Runs
      summary: List case-level evaluation results
      operationId: listCaseEvaluationResults
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: metric
          in: query
          schema:
            type: string
        - name: min_score
          in: query
          schema:
            type: number
        - name: max_score
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Case evaluation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseEvaluationResultList"


  /evaluation/runs/{run_id}/results/cases/{case_id}:
    get:
      tags:
        - Runs
      summary: Get case-level evaluation result
      operationId: getCaseEvaluationResult
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Case evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseEvaluationResult"
        "404":
          $ref: "#/components/responses/NotFound"


components:

  # ============================================================
  # Parameters
  # ============================================================

  parameters:

    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string

    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string

    BenchmarkId:
      name: benchmark_id
      in: path
      required: true
      schema:
        type: string

    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50


  # ============================================================
  # Schemas
  # ============================================================

  schemas:

    # ----------------------------------------------------------
    # Dataset
    # ----------------------------------------------------------

    DatasetStatus:
      type: string
      enum:
        - draft
        - ready
        - archived


    Dataset:
      type: object
      required:
        - id
        - name
        - version
        - status
        - case_count

      properties:

        id:
          type: string
          example: dataset-financial-rag-v1

        name:
          type: string
          example: Financial RAG Benchmark

        version:
          type: string
          example: "1.0.0"

        description:
          type: string

        status:
          $ref: "#/components/schemas/DatasetStatus"

        case_count:
          type: integer
          example: 2000

        source:
          type: object
          additionalProperties: true
          example:
            type: document_version
            document_count: 634

        generation:
          type: object
          additionalProperties: true
          description: |
            Metadata describing how benchmark cases were generated.
          example:
            generator: llm
            model: gpt-5
            prompt_version: v2

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time


    DatasetCreate:
      type: object
      required:
        - name

      properties:

        name:
          type: string

        version:
          type: string
          default: "1.0.0"

        description:
          type: string

        source:
          type: object
          additionalProperties: true

        generation:
          type: object
          additionalProperties: true


    DatasetList:
      type: object
      required:
        - items
        - page
        - page_size
        - total

      properties:

        items:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"

        page:
          type: integer

        page_size:
          type: integer

        total:
          type: integer


    # ----------------------------------------------------------
    # Evaluation Case
    # ----------------------------------------------------------

    EvaluationCase:
      type: object
      required:
        - id
        - dataset_id
        - user_input
        - reference

      properties:

        id:
          type: string
          example: qa-000001

        dataset_id:
          type: string

        document_version_id:
          type: string
          description: Source document version used to generate the case.

        document_type_definition_id:
          type: string
          description: DTD associated with the source document.

        user_input:
          type: string
          description: Benchmark question.

        reference:
          type: string
          description: Ground-truth answer.

        reference_text:
          type: string
          description: Exact source text containing the answer.

        reference_spans:
          type: array
          description: |
            Character ranges in clean_ref that support the reference answer.
          items:
            $ref: "#/components/schemas/ReferenceSpan"

        reference_chunk_ids:
          type: array
          description: |
            Chunk IDs containing the reference spans.
          items:
            type: string

        metadata:
          type: object
          additionalProperties: true


    ReferenceSpan:
      type: object
      required:
        - start_char_index
        - end_char_index

      properties:

        start_char_index:
          type: integer
          minimum: 0

        end_char_index:
          type: integer
          minimum: 0

        text:
          type: string


    CaseList:
      type: object
      required:
        - items
        - page
        - page_size
        - total

      properties:

        items:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationCase"

        page:
          type: integer

        page_size:
          type: integer

        total:
          type: integer


    # ----------------------------------------------------------
    # Benchmark
    # ----------------------------------------------------------

    Benchmark:
      type: object
      required:
        - id
        - name
        - dataset_id
        - target
        - metrics

      properties:

        id:
          type: string

        name:
          type: string

        description:
          type: string

        dataset_id:
          type: string

        target:
          $ref: "#/components/schemas/BenchmarkTarget"

        generation:
          $ref: "#/components/schemas/GenerationConfig"

        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricConfig"

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time


    BenchmarkCreate:
      type: object
      required:
        - name
        - dataset_id
        - target
        - metrics

      properties:

        name:
          type: string

        description:
          type: string

        dataset_id:
          type: string

        target:
          $ref: "#/components/schemas/BenchmarkTarget"

        generation:
          $ref: "#/components/schemas/GenerationConfig"

        metrics:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MetricConfig"


    BenchmarkUpdate:
      type: object
      properties:

        name:
          type: string

        description:
          type: string

        target:
          $ref: "#/components/schemas/BenchmarkTarget"

        generation:
          $ref: "#/components/schemas/GenerationConfig"

        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricConfig"


    BenchmarkList:
      type: object
      required:
        - items
        - page
        - page_size
        - total

      properties:

        items:
          type: array
          items:
            $ref: "#/components/schemas/Benchmark"

        page:
          type: integer

        page_size:
          type: integer

        total:
          type: integer


    # ----------------------------------------------------------
    # Benchmark Target
    # ----------------------------------------------------------

    BenchmarkTarget:
      type: object
      required:
        - document_type_definition_ids

      properties:

        document_type_definition_ids:
          type: array
          minItems: 1
          items:
            type: string

        fusioner:
          $ref: "#/components/schemas/ProcessorOverride"

        reranker:
          $ref: "#/components/schemas/ProcessorOverride"

        filter:
          $ref: "#/components/schemas/ProcessorOverride"

        cutter:
          $ref: "#/components/schemas/ProcessorOverride"

        top_k:
          type: integer
          minimum: 1
          default: 10


    ProcessorOverride:
      type: object
      description: |
        Optional query processor override.
        If omitted, the processor configured by the DTD is used.

      properties:

        enabled:
          type: boolean
          default: true

        config:
          type: object
          additionalProperties: true


    # ----------------------------------------------------------
    # Generation
    # ----------------------------------------------------------

    GenerationConfig:
      type: object
      description: Configuration for generating the final RAG answer.

      properties:

        enabled:
          type: boolean
          default: false

        provider:
          type: string

        model:
          type: string

        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0

        prompt:
          type: string

        prompt_version:
          type: string

        max_tokens:
          type: integer
          minimum: 1


    # ----------------------------------------------------------
    # Metric
    # ----------------------------------------------------------

    MetricProvider:
      type: string
      enum:
        - native
        - ragas
        - custom


    MetricCategory:
      type: string
      enum:
        - retrieval
        - context
        - generation
        - correctness
        - relevance
        - custom


    MetricDefinition:
      type: object
      required:
        - name
        - display_name
        - provider
        - category
        - requires

      properties:

        name:
          type: string
          example: faithfulness

        display_name:
          type: string
          example: Faithfulness

        description:
          type: string

        provider:
          $ref: "#/components/schemas/MetricProvider"

        category:
          $ref: "#/components/schemas/MetricCategory"

        requires:
          type: array
          description: Required fields in an evaluation sample.
          items:
            type: string
          example:
            - response
            - retrieved_contexts

        supports_batch:
          type: boolean

        configurable:
          type: boolean

        config_schema:
          type: object
          additionalProperties: true


    MetricConfig:
      type: object
      required:
        - metric
        - provider

      properties:

        metric:
          type: string
          example: faithfulness

        provider:
          $ref: "#/components/schemas/MetricProvider"

        config:
          type: object
          additionalProperties: true
          description: |
            Provider-specific metric configuration.

            For Ragas metrics this may contain:
              - evaluator LLM
              - temperature
              - prompt
              - prompt version
              - batch/concurrency configuration
              - reasoning configuration

          example:
            model: gpt-5
            temperature: 0
            save_reason: true


    # ----------------------------------------------------------
    # Run
    # ----------------------------------------------------------

    RunStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - cancelled


    BenchmarkRunCreate:
      type: object
      properties:

        case_ids:
          type: array
          description: |
            Optional subset of cases.
            If omitted, all cases in the benchmark dataset are evaluated.
          items:
            type: string

        concurrency:
          type: integer
          minimum: 1
          default: 10

        metadata:
          type: object
          additionalProperties: true


    BenchmarkRun:
      type: object
      required:
        - id
        - benchmark_id
        - dataset_id
        - status

      properties:

        id:
          type: string

        benchmark_id:
          type: string

        dataset_id:
          type: string

        status:
          $ref: "#/components/schemas/RunStatus"

        total_cases:
          type: integer

        completed_cases:
          type: integer

        failed_cases:
          type: integer

        started_at:
          type: string
          format: date-time

        completed_at:
          type: string
          format: date-time

        error:
          type: string

        metadata:
          type: object
          additionalProperties: true

        summary:
          $ref: "#/components/schemas/EvaluationResult"


    BenchmarkRunList:
      type: object
      required:
        - items
        - page
        - page_size
        - total

      properties:

        items:
          type: array
          items:
            $ref: "#/components/schemas/BenchmarkRun"

        page:
          type: integer

        page_size:
          type: integer

        total:
          type: integer


    # ----------------------------------------------------------
    # Evaluation Result
    # ----------------------------------------------------------

    EvaluationResult:
      type: object
      required:
        - run_id
        - metrics

      properties:

        run_id:
          type: string

        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricResult"


    MetricResult:
      type: object
      required:
        - metric
        - provider
        - score

      properties:

        metric:
          type: string
          example: recall@10

        provider:
          $ref: "#/components/schemas/MetricProvider"

        score:
          type: number

        sample_count:
          type: integer

        failed_count:
          type: integer

        metadata:
          type: object
          additionalProperties: true


    # ----------------------------------------------------------
    # Case-level Result
    # ----------------------------------------------------------

    CaseEvaluationResult:
      type: object
      required:
        - run_id
        - case_id
        - metrics

      properties:

        run_id:
          type: string

        case_id:
          type: string

        user_input:
          type: string

        reference:
          type: string

        retrieved_contexts:
          type: array
          items:
            $ref: "#/components/schemas/RetrievedContext"

        response:
          type: string

        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricCaseResult"

        metadata:
          type: object
          additionalProperties: true


    RetrievedContext:
      type: object
      required:
        - chunk_id
        - content

      properties:

        chunk_id:
          type: string

        content:
          type: string

        score:
          type: number

        rank:
          type: integer

        source:
          type: object
          additionalProperties: true


    MetricCaseResult:
      type: object
      required:
        - metric
        - score

      properties:

        metric:
          type: string

        provider:
          $ref: "#/components/schemas/MetricProvider"

        score:
          type: number

        reason:
          type: string
          description: |
            Optional evaluator explanation.
            Particularly useful for LLM-based Ragas metrics.

        details:
          type: object
          additionalProperties: true


    CaseEvaluationResultList:
      type: object
      required:
        - items
        - page
        - page_size
        - total

      properties:

        items:
          type: array
          items:
            $ref: "#/components/schemas/CaseEvaluationResult"

        page:
          type: integer

        page_size:
          type: integer

        total:
          type: integer


  # ============================================================
  # Responses
  # ============================================================

  responses:

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string