name: checkpointer
type: postgresql_checkpointer

enabled: true
required: true

startup_timeout_seconds: 15

config:
  # DSN 从 postgresql 数据源推导：取其 dsn 并去掉 +asyncpg 方言后缀。
  # 这样密码只写在一处，不会出现两边不一致。
  #
  # 推导结果等价于：
  #   postgresql://postgres:***@localhost:5432/ytrader_agent
  #
  # 也可以直接写死，二选一：
  #   dsn: "postgresql://postgres:***@localhost:5432/ytrader_agent"
  derive_from: postgresql

  # checkpointer 的连接池与业务池相互独立（驱动不同、生命周期不同）。
  # 一次运行期间会反复写 checkpoint，但不能占太多连接。
  pool_min_size: 1
  pool_max_size: 5
