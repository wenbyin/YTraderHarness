name: checkpointer
type: postgresql_checkpointer

enabled: true
required: true

startup_timeout_seconds: 15

config:
  # DSN 从 postgresql 数据源推导：取其 dsn 并去掉 +asyncpg 方言后缀。
  # 这样密码只写在一处，不会出现两边不一致。
  #
  # 推导结果等价于：
  #   postgresql://postgres:***@localhost:5432/ytrader_agent
  #
  # 也可以直接写死，二选一：
  #   dsn: "postgresql://postgres:***@localhost:5432/ytrader_agent"
  derive_from: postgresql

  # checkpointer 的连接池与业务池相互独立（驱动不同、生命周期不同）。
  # 一次运行期间会反复写 checkpoint。
  #
  # ⚠️ 上限要覆盖**并发 run 数**，不是"看起来够用"就行：压测是 102 并发，
  #    而 langgraph 的 saver 原本还有一个全局锁（见下面关掉的开关），
  #    60 条连接 + 那把锁一起把 pre-node 空档拖到 6 秒级。
  #
  # ⚠️ PostgreSQL 的 max_connections（本机默认 100）必须同时调大：
  #    本池 + 业务池（10 + max_overflow 20）+ store 共用，120 时
  #    至少要 200。只改这里不改 PG，连接会在建连阶段报
  #    "too many clients already"。
  pool_min_size: "${CHECKPOINTER_POOL_MIN:-2}"
  pool_max_size: "${CHECKPOINTER_POOL_MAX:-60}"

  # langgraph 的 AsyncPostgresSaver 用一个 asyncio.Lock 串行化**所有**
  # cursor 操作（读和写都算）。单连接时必须；连接池下只会把整个进程的
  # checkpoint I/O 排成一条队。false = 关闭它，让池真正并发。
  #
  # 回退开关：设成 true 就退回旧行为（用于怀疑并发导致数据错乱时对照）。
  parallel_cursor_operations: "${CHECKPOINTER_PARALLEL_CURSORS:-true}"

  # 同一个池上的 LangGraph store（跨轮存储）。目前唯一的消费者是审批
  # 拦截器的批准账本（app/agent/tools/processor/interceptor/approval.py）
  # —— 批准记录必须落在**持久**存储上，否则重启后停在 waiting_input 的
  # 运行 resume 时，之前批过的会再问一遍。
  #
  # ⚠️ 单位是**分钟**。langgraph 的 BaseStore 就按分钟收 ttl，而本仓库
  # 审批配置里那个 always_ttl_seconds 是**秒** —— 两者不要互相折算，
  # 换算收在 StoreApprovalLedger 那一处。这里按分钟原样填。
  store:
    # 7 天。**没显式传 ttl** 的写入拿到的是这个有效期，审批账本里
    # 「单次批准」那一笔就是这种写入。它不能省：没有它那些行的
    # expires_at 是 NULL，而清扫只删 expires_at 非空的行 —— 表只增不减。
    default_ttl_minutes: 10080

    # 后台清扫间隔。清扫任务不会自动启动，由 GraphCheckpointerProvider
    # 在 open 时拉起、close 时停掉。
    sweep_interval_minutes: 60
