# 运行事件流（Redis Stream）的配置。
#
# 为什么放在 app/config/ 顶层，而不是 datasource/ 子目录
# ----------------------------------------------------
# 数据源加载器只 glob(`app/config/datasource/*.yaml`)（见
# infra/datasource/loader.py）。这份配置不是数据源，放到那个子目录里
# 会因为缺少顶层 `type` 被跳过并每次启动打一条 warning。

# 关掉后 publish() 一条 Redis 命令都不发，直接返回 False。
# 用途：本地没有 Redis、或这版只想把日志压干净时，不必去改 redis.yaml。
enabled: true

# 事件流的 topic。最终的键是 "<key_prefix>:<topic_id>"，
# 即 topic=agent_run、topic_id=run_123 时键为 "agent_run:run_123"。
key_prefix: "${AGENT_EVENT_STREAM_PREFIX:-agent_run}"

# 单条 stream 的长度上限（XADD ... MAXLEN ~）。null = 不裁剪。
#
# ~ 是**近似**裁剪：Redis 按内部宏节点成块地丢，比精确裁剪便宜得多，
# 代价是实际长度可能略高于这个数。事件流的用途是"看当前发生了什么"，
# 不要求精确条数，因此这个取舍成立。
maxlen: 10000

# 键的存活秒数，**每次写入都刷新**（滑动）—— 因此是"最后一次事件之后
# ttl 秒过期"，一个已经结束的运行不会永久占着键。null = 不过期。
#
# ⚠️ maxlen 与 ttl 管的是**两个不同的东西，两个都要**：
#   maxlen 限制**一条** stream 有多长；
#   但被裁空的键**仍然存在**（下次 XADD 会复用同一个键）。
# 一个 run 一条 stream，跑一万次就是一万个键 —— 光靠 maxlen 止不住
# 键数量的增长，那是内存泄漏，而且症状很隐蔽（每条流都很短，看着没问题）。
ttl_seconds: 600

# ---- 读取端（SSE 订阅）----

# XREAD BLOCK 一次阻塞多久（毫秒）。0 = 不阻塞（变成忙轮询，别这么配）。
#
# ⚠️ **必须明显小于 app/config/datasource/redis.yaml 的 socket_timeout（默认 5 秒）**。
# 阻塞时长超过 socket_timeout 时，命令会被客户端的读超时打断成一个
# 看起来像"网络故障"的错误；而 redis.yaml 里那段注释早就写了这条约束。
#
# 1000 是折中：既让每个 SSE 连接每秒醒一次（顺便当心跳节拍），
# 又给 socket_timeout 留出 4 秒余量。
block_ms: 1000

# **连续**这么多次空读之后，去探活一次：这个 run 是不是已经不会再有事件了。
#
# 一次空读 = 一次 XREAD BLOCK 到点、没有新记录，默认耗时 block_ms（1000ms），
# 所以 5 约等于 5 秒 —— 和上面那条心跳的节拍天然对齐。
#
# ⚠️ 用「空读**次数**」而不是毫秒表达，是为了让测试注入一个小数字就能触发
#    探活，不必 sleep。改 block_ms 时这个数字的含义跟着变。
#
# ⚠️ 探活只在**空闲**时跑：有事件在流动时绝不查库 —— 一个正常跑着的长回答
#    不该因为探活去打搅 Postgres。
idle_probe_after_reads: 5

# 单个订阅者的待发队列上限（条）。
#
# 满了就**断开这一个订阅者**，不阻塞共享循环、也不丢最旧。理由见
# app/agent/event/run_stream.py：共享循环是同一个 run 所有订阅者共用的，
# 为一个慢消费者把它堵住，等于让所有人都跟着卡；而丢最旧会让正文
# （message.delta 是逐 token 的）静默缺洞，前端无从知道缺了哪段。
#
# 取值要能让一次完整补发放得下：一条流的长度上限是 maxlen（10000）。
# 2000 是折中 —— 覆盖绝大多数补发，同时把「一个卡住的浏览器标签」能占住的
# 内存封住。
subscriber_queue_size: 2000

# 同时在订阅的 **run** 数上限。
#
# HTTP SSE 路由达到上限时**等待**槽位（attach_wait），不再返回 503；
# 同一个 run 的新订阅者复用现有流，不占额度。
#
# ⚠️ 必须**严格小于** app/config/datasource/redis.yaml 的 stream_max_connections ——
#    池满时 redis-py 是立刻抛、不排队，取等号时一次重试就能撞出来。
#
# ⚠️ Windows 的 SelectorEventLoop 还受 select() 约 512 socket 限制；
#    这个值不能贴满 512，Driver 侧还会按 stress_eval.yaml 的
#    concurrency_safety_ratio 再留余量。
max_active_run_streams: "${MAX_ACTIVE_RUN_STREAMS:-300}"

# 连续读失败**达到**这个次数，就把异常抛给订阅方（含第一次，也就是最多
# 重试 N-1 次）。没到就重发一个心跳节拍继续读（见 reader.py）。
#
# ⚠️ 为什么需要重试：上面那条"block_ms < socket_timeout"只保证**我们**
# 不会把客户端读超时撑爆，挡不住另一种情况 —— 事件循环被别的同步代码
# 卡住 ≥ socket_timeout 时，asyncio 的定时器会在循环恢复的瞬间先到期，
# 于是"回复早就到了"被谎报成读超时（已实测复现：Redis 在 2.19 秒就把
# 记录写进流了，客户端 6.00 秒报读超时）。这种情况重试一次基本必成。
#
# 设成 1 = 不重试，退回改造前的行为（第一次就断流）—— 留一个能一键
# 回滚的开关，比"改代码才能退回去"可靠。
read_max_consecutive_errors: 3

# ---- 写入端（发布）----

# 写队列的上限（条）。写线程从这条队列里取事件、用同步客户端写进 Redis。
#
# ⚠️ 为什么必须有界：写线程的吞吐是有上界的 —— Redis 停摆时，每条写入
# 都要吃掉一个 socket_timeout（redis.yaml: 5 秒），即 1 条/5 秒；而
# message.delta 是**逐 token** 的，突发可以上百条/秒。无界队列在这里
# 不是缓冲，是内存泄漏。
#
# 满了丢的是**最新**那条（已接收的照常按序写出），不是最旧 —— 丢尾部
# 而不是丢中间，正文不会被撕开空洞，而且调用方拿到了明确的 False。
# 一个 run 的长回答动辄几千个 delta，10000 大约能扛住一次几十秒的
# Redis 抖动；真的丢到了，message.completed 里带全文，可以据此对账。
#
# ⚠️ 20000 是给思维链留的余量（原来 10000）
# -----------------------------------------
# message.reasoning.delta 是**同一根队列**上的第二条逐 token 通道，推理
# 模型的思维链常常比正文还长 —— 量级大致翻倍。而丢弃策略是"一旦丢就丢到
# 排空"，所以推理挤占的正是**正文**的余量：一条冗长的思维链可以把
# message.delta 的缓冲吃掉，症状是用户那边正文缺了中间一段（正文才是
# 首要 UX）。
#
# 加一倍只是把余量还回来，不是消除它：真丢到了，两条通道各自的
# completed（都带全文）负责对账。
#
# maxlen 与 subscriber_queue_size **没跟着动**：那两处是互相咬合的
# （subscriber_queue_size 要装得下一次补发，按 maxlen 定），只加 maxlen
# 会让"重连后补发"更容易把订阅者顶掉。要调就两处一起调，并且先有观察。
write_queue_size: 50000

# 写线程数（分片数）。
#
# 事件按 stream key 哈希到固定分片；**同一条 run 的事件始终落在同一个
# 分片**，因此 run 内的顺序仍然由该分片的 FIFO 保证。多个分片并行写，
# 用来缓解单写线程在 GIL / Redis 往返上的队头阻塞。
#
# ⚠️ 必须 ≤ redis.yaml 的 sync_max_connections（每个线程一条同步连接）。
write_workers: "${EVENT_WRITE_WORKERS:-4}"
